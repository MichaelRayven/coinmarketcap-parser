[project]
name = "coinmarketcap-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.135.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.48",
]

[dependency-groups]
dev = [
    "prek>=0.3.6",
    "ruff>=0.15.6",
]

[tool.ruff]
src = ["src"]
include = ["src/**/*.py"]
line-length = 100
fix = true
